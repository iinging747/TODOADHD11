<style>
:root{
  --bg-deep:#EAE2D2;
  --bg:#F1EBE0;
  --paper:#FBF7EE;
  --paper-soft:#F6F0E3;
  --paper-warm:#F0E9DA;
  --tan:#DCD1BB;
  --tan-soft:#E8DEC8;
  --tan-deep:#C8BB9E;
  --ink:#2D2620;
  --ink-soft:#6E6452;
  --ink-muted:#A89B85;
  --hairline:rgba(45,38,32,.12);
  --hairline-soft:rgba(45,38,32,.06);
  --rose:#C49089;
  --rose-soft:#E8C9C4;
  --olive:#8A8260;
  --olive-soft:#C8C4A8;
  --indigo:#7A82A8;
  --shadow-page:0 1px 0 rgba(255,255,255,.7) inset,0 30px 60px -28px rgba(80,55,25,.22),0 12px 24px -16px rgba(80,55,25,.14);
  --shadow-soft:0 8px 24px -12px rgba(80,55,25,.18);
  --fd:'Cormorant', 'Pretendard', serif;
  --fs:'Pinyon Script', cursive;
  --fb:'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  --fui:'Albert Sans', 'Pretendard', sans-serif;
  --fg:'GmarketSans', 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
}
body.dark{
  --bg-deep:#15110D;
  --bg:#1C1813;
  --paper:#252019;
  --paper-soft:#2C2620;
  --paper-warm:#322B23;
  --tan:#4A4234;
  --tan-soft:#3A3326;
  --tan-deep:#6B5E48;
  --ink:#EDE3D0;
  --ink-soft:#B5A88E;
  --ink-muted:#7A6F5C;
  --hairline:rgba(237,227,208,.10);
  --hairline-soft:rgba(237,227,208,.05);
  --rose:#D6A29B;
  --rose-soft:#4A3530;
  --olive:#B1A87E;
  --olive-soft:#3A3825;
  --indigo:#A0A8CC;
  --shadow-page:0 1px 0 rgba(255,255,255,.03) inset,0 30px 60px -28px rgba(0,0,0,.6),0 12px 24px -16px rgba(0,0,0,.4);
  --shadow-soft:0 8px 24px -12px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
@supports (padding: max(0px)){
  body{
    padding-top:env(safe-area-inset-top);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
    padding-bottom:env(safe-area-inset-bottom);
  }
}
/* hide URL bar look when launched from home screen */
@media all and (display-mode: standalone){
  .mobile-bar{padding-top:max(10px, env(safe-area-inset-top))}
}
body{
  min-height:100vh;
  font-family:var(--fb);font-weight:300;color:var(--ink);
  background:
    radial-gradient(120% 80% at 10% 5%, #F7F1E4 0%, transparent 55%),
    radial-gradient(100% 90% at 95% 100%, #E8DEC8 0%, transparent 50%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
  background-attachment:fixed;
  letter-spacing:.005em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  transition:background .3s;
}
body.dark{
  background:
    radial-gradient(120% 80% at 10% 5%, #2A2218 0%, transparent 55%),
    radial-gradient(100% 90% at 95% 100%, #1E1810 0%, transparent 50%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(255,255,255,.3) 1px,transparent 1px),radial-gradient(rgba(90,65,30,.04) 1px,transparent 1px);
  background-size:3px 3px,7px 7px;background-position:0 0,1px 2px;
  mix-blend-mode:overlay;opacity:.6;
}
body.dark::before{opacity:.18}

button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;font-weight:inherit}
input,textarea,select{font-family:inherit;color:inherit;background:none;border:0;outline:0;font-weight:inherit}

/* ============ LOGIN GATE ============ */
.gate{
  position:fixed;inset:0;z-index:50;
  display:grid;place-items:center;padding:32px 24px;
  background:linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
  transition:opacity .45s ease, visibility .45s ease;
}
.gate.hide{opacity:0;visibility:hidden;pointer-events:none}
.gate-theme{
  position:absolute;top:24px;right:24px;
  display:flex;align-items:center;gap:8px;
  font-family:var(--fui);font-size:10.5px;font-weight:400;
  letter-spacing:.2em;text-transform:uppercase;color:var(--ink-muted);
  padding:8px 14px;border:1px solid var(--hairline);border-radius:999px;
  transition:color .15s, border-color .15s;
}
.gate-theme:hover{color:var(--ink-soft);border-color:var(--ink-muted)}
.gate-theme svg{width:13px;height:13px}

.gate-card{
  width:100%;max-width:520px;
  background:var(--paper);border-radius:4px;
  padding:60px 52px 44px;
  box-shadow:var(--shadow-page);
  position:relative;text-align:center;
}
.gate-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:6px;
  background:linear-gradient(90deg, var(--tan) 0%, var(--tan-soft) 50%, var(--tan) 100%);
}
.gate-mark{
  font-family:var(--fui);font-size:10.5px;font-weight:500;
  letter-spacing:.32em;text-transform:uppercase;color:var(--ink-muted);
  margin-bottom:24px;
}
.gate-mark::before, .gate-mark::after{
  content:"——";margin:0 10px;color:var(--ink-muted);letter-spacing:-.06em;
}
.gate-title{
  font-family:var(--fg);font-weight:700;font-size:78px;
  line-height:.95;letter-spacing:-.03em;
  margin:0 0 18px;color:var(--ink);
}
.gate-subtitle{
  font-family:var(--fb);font-weight:300;font-size:15.5px;
  line-height:1.6;letter-spacing:.005em;color:var(--ink-soft);
  margin:0 0 6px;
}
.gate-subtitle b{font-weight:500;color:var(--ink)}
.gate-lede{
  font-family:var(--fb);font-weight:300;font-size:14px;line-height:1.75;
  color:var(--ink-muted);margin:18px 0 36px;letter-spacing:.005em;
}
.gate-divider{
  height:1px;background:var(--hairline);margin:32px 0 28px;position:relative;
}
.gate-divider::after{
  content:"·";position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);background:var(--paper);
  padding:0 12px;color:var(--ink-muted);font-size:18px;
}
.gsi-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}

/* Auth tabs */
.auth-tabs{
  display:flex;gap:0;margin:0 0 24px;
  border-bottom:1px solid var(--hairline);
}
.auth-tab{
  flex:1;padding:12px 0;
  font-family:var(--fui);font-size:11px;font-weight:500;
  letter-spacing:.22em;text-transform:uppercase;color:var(--ink-muted);
  border-bottom:1.5px solid transparent;
  margin-bottom:-1px;transition:color .15s, border-color .15s;
}
.auth-tab:hover{color:var(--ink-soft)}
.auth-tab.active{color:var(--ink);border-bottom-color:var(--ink)}

.auth-form{text-align:left}
.auth-form .field{margin-bottom:14px}
.auth-form .field label{
  font-family:var(--fui);font-size:10.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-soft);font-weight:500;margin-bottom:6px;
}
.auth-form .field label .hint{
  font-family:var(--fb);font-size:10.5px;font-weight:300;
  color:var(--ink-muted);letter-spacing:0;text-transform:none;
  margin-left:6px;font-style:italic;
}
.auth-form .input{
  background:var(--paper-soft);border:1px solid var(--hairline);
  padding:13px 15px;font-size:14.5px;font-family:var(--fb);
  width:100%;transition:border-color .15s;
}
.auth-form .input:focus{border-color:var(--ink-soft);background:var(--paper)}

.auth-error{
  margin:8px 0 0;padding:10px 14px;border-radius:2px;
  background:var(--rose-soft);border-left:2px solid var(--rose);
  font-family:var(--fb);font-size:13px;color:var(--ink);
  line-height:1.5;font-weight:400;
}

.auth-submit{
  width:100%;margin-top:14px;padding:14px 22px;
  font-family:var(--fui);font-size:11.5px;font-weight:500;
  letter-spacing:.22em;text-transform:uppercase;
  justify-content:center;display:flex;align-items:center;gap:10px;
}
.auth-submit.loading{opacity:.6;pointer-events:none}
.auth-submit.loading::after{
  content:"";width:11px;height:11px;border:1.5px solid var(--paper);
  border-top-color:transparent;border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.auth-foot{
  text-align:center;margin:18px 0 0;
  font-family:var(--fb);font-size:13px;font-weight:300;color:var(--ink-soft);
  letter-spacing:.005em;
}
.auth-swap{
  color:var(--ink);font-weight:500;text-decoration:none;
  border-bottom:1px solid var(--ink-muted);padding-bottom:1px;
  margin-left:4px;
}
.auth-swap:hover{border-color:var(--ink)}
.gate-privacy{
  font-family:var(--fb);font-size:12px;font-weight:300;line-height:1.7;
  color:var(--ink-muted);margin:24px 0 0;letter-spacing:.005em;
}
.gate-privacy b{font-weight:500;color:var(--ink-soft)}

/* ============ APP SHELL ============ */
.app{
  position:relative;z-index:1;
  max-width:1280px;margin:0 auto;
  padding:36px 28px 80px;
  display:grid;grid-template-columns:200px 1fr;gap:36px;align-items:start;
}
.rail{
  position:sticky;top:36px;padding-top:8px;
  display:flex;flex-direction:column;gap:24px;
  max-height:calc(100vh - 72px);overflow-y:auto;
}
.rail::-webkit-scrollbar{width:3px}
.rail::-webkit-scrollbar-thumb{background:var(--tan-soft)}
.rail-brand{padding-bottom:18px;border-bottom:1px solid var(--hairline)}
.rail-script{font-family:var(--fg);font-weight:700;font-size:22px;color:var(--ink);line-height:1;margin-bottom:10px;display:block;letter-spacing:-.02em}
.rail-title{font-family:var(--fd);font-weight:300;font-size:22px;letter-spacing:.16em;color:var(--ink);line-height:1.2;margin:0}
.rail-title b{font-weight:400;display:block;font-size:13px;letter-spacing:.22em;color:var(--ink-soft);margin-top:6px;text-transform:uppercase}
.rail-desc{font-family:var(--fb);font-weight:300;font-size:12px;line-height:1.55;color:var(--ink-muted);margin:10px 0 0}

.nav-section{display:flex;flex-direction:column;gap:1px}
.nav-section h4{font-family:var(--fui);font-size:10px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 10px;padding:0 4px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:8px 4px;border-radius:0;
  text-align:left;font-family:var(--fb);font-weight:400;font-size:13.5px;
  color:var(--ink-soft);letter-spacing:.005em;
  border-left:1px solid transparent;padding-left:14px;
  transition:color .15s, border-color .15s, padding-left .2s;
}
.nav-item:hover{color:var(--ink);padding-left:18px}
.nav-item.active{color:var(--ink);border-left-color:var(--ink);font-weight:500}
.nav-item .ico{font-family:var(--fui);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted);width:18px;flex-shrink:0}
.nav-item.active .ico{color:var(--ink)}

.rail-bottom{margin-top:auto;padding-top:18px;border-top:1px solid var(--hairline);display:flex;flex-direction:column;gap:12px}
.theme-btn{
  display:flex;align-items:center;gap:10px;
  font-family:var(--fui);font-size:11px;font-weight:400;
  letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);padding:4px;
}
.theme-btn:hover{color:var(--ink)}
.theme-btn svg{width:13px;height:13px}
.user-chip{display:flex;align-items:center;gap:10px;font-family:var(--fui);font-size:11.5px;color:var(--ink-soft);letter-spacing:.02em}
.user-chip .user-init{
  width:26px;height:26px;border-radius:50%;
  background:var(--tan-soft);color:var(--ink);
  display:grid;place-items:center;flex-shrink:0;
  font-family:var(--fb);font-weight:500;font-size:13px;letter-spacing:0;
  text-transform:uppercase;
}
.user-chip .name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-chip .signout{font-family:var(--fui);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid var(--hairline);padding-bottom:1px}
.user-chip .signout:hover{color:var(--rose)}

.sync-row{display:flex;align-items:center;gap:8px;padding:4px;font-family:var(--fui);font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--ink-muted);flex-shrink:0}
.sync-row.synced .sync-dot{background:var(--olive)}
.sync-row.syncing .sync-dot{background:var(--rose);animation:pulse 1.2s ease infinite}
.sync-row.error .sync-dot{background:var(--rose)}
.sync-row.synced{color:var(--olive)}
.sync-row.syncing{color:var(--rose)}
.sync-row.error{color:var(--rose)}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

.main{min-width:0}
.hero{text-align:center;position:relative;padding:18px 0 32px;margin-bottom:8px}
.hero-title{font-family:var(--fd);font-weight:300;font-size:clamp(72px,11vw,156px);line-height:.85;letter-spacing:.12em;color:var(--ink);margin:0;position:relative;z-index:1}
.hero-script{position:absolute;left:50%;bottom:24px;transform:translateX(-12%);font-family:var(--fs);font-size:clamp(40px,6vw,86px);color:var(--ink);line-height:1;z-index:2;letter-spacing:.01em}

.sub-row{display:flex;justify-content:space-between;align-items:flex-end;margin:0 auto 18px;padding:0 8px;gap:24px;flex-wrap:wrap}
.sub-field{display:flex;align-items:baseline;gap:12px}
.sub-label{font-family:var(--fui);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);font-weight:400}
.sub-value{font-family:var(--fd);font-size:22px;font-weight:400;color:var(--ink);letter-spacing:.04em;border-bottom:1px solid var(--ink);padding:0 28px 2px 4px;min-width:140px}
.sub-nav{display:flex;gap:6px;align-items:center}
.sub-nav button{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--hairline);background:var(--paper);border-radius:50%;transition:background .15s, border-color .15s}
.sub-nav button:hover{background:var(--tan-soft);border-color:var(--tan-deep)}
.sub-nav svg{width:11px;height:11px;color:var(--ink-soft)}
.sub-nav .today{width:auto;border-radius:999px;padding:0 14px;height:30px;font-family:var(--fui);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}

/* CAL */
.cal{max-width:980px;margin:0 auto;background:var(--paper);border-radius:2px;box-shadow:var(--shadow-page);overflow:hidden;position:relative}
.cal-head{display:grid;grid-template-columns:repeat(7, 1fr);background:var(--paper-soft);border-bottom:1px solid var(--hairline)}
.cal-head div{font-family:var(--fui);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;text-align:center;padding:14px 8px;color:var(--ink-soft)}
.cal-head div.sun{color:var(--rose)}
.cal-head div.sat{color:var(--olive)}
.cal-grid{display:grid;grid-template-columns:repeat(7, 1fr);grid-auto-rows:minmax(110px, 1fr)}
.day{position:relative;padding:8px 10px 10px;border-right:1px solid var(--hairline-soft);border-bottom:1px solid var(--hairline-soft);background:var(--paper);text-align:left;transition:background .15s;display:flex;flex-direction:column;min-height:110px}
.day:nth-child(7n){border-right:0}
.day:hover{background:var(--paper-soft)}
.day .tab{position:absolute;top:0;left:0;width:38px;height:14px;background:var(--tan-soft)}
.day.hot .tab{background:var(--rose-soft)}
.day.alldone .tab{background:var(--olive-soft)}
.day.other{background:var(--paper-soft);opacity:.55}
.day.other .num{color:var(--ink-muted)}
.day .num{font-family:var(--fd);font-weight:400;font-size:16px;letter-spacing:.04em;color:var(--ink);margin:4px 0 0 28px;line-height:1}
.day.sun .num{color:var(--rose)}
.day.sat .num{color:var(--olive)}
.day.today .num{font-weight:500;position:relative}
.day.today .num::after{content:"";position:absolute;left:-3px;right:-3px;bottom:-3px;height:1px;background:var(--ink)}
.day .marks{margin-top:auto;display:flex;flex-direction:column;gap:3px;font-family:var(--fb);font-weight:300;font-size:11.5px;color:var(--ink-soft);line-height:1.35;letter-spacing:.005em;max-height:60px;overflow:hidden}
.day .marks .mk{display:flex;align-items:flex-start;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .marks .mk::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--tan-deep);margin-top:6px;flex-shrink:0}
.day .marks .mk.done::before{background:var(--olive)}
.day .marks .mk.done{text-decoration:line-through;text-decoration-thickness:.5px;color:var(--ink-muted)}
.day .marks .mk.hot::before{background:var(--rose)}
.day .more{font-family:var(--fui);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);margin-top:2px}
.day.selected{background:var(--tan-soft)}
body.dark .day.selected{background:var(--paper-warm)}
.day.selected .tab{background:var(--ink)}

.brief-strip{max-width:980px;margin:18px auto 0;background:var(--paper);border-radius:2px;padding:24px 28px 26px;box-shadow:var(--shadow-soft);position:relative}
.brief-strip::before{content:"";position:absolute;top:0;left:32px;width:60px;height:14px;background:var(--tan-soft)}
.brief-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:8px}
.brief-block h3{font-family:var(--fui);font-size:10.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 12px}
.brief-text{font-family:var(--fb);font-weight:300;font-size:14px;line-height:1.7;color:var(--ink);margin:0;letter-spacing:.005em}
.brief-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--fui);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);border:1px solid var(--hairline);padding:5px 10px;border-radius:999px;background:var(--paper-soft)}
.pill.hot{color:var(--rose);border-color:var(--rose-soft)}
.pill.done{color:var(--olive);border-color:var(--olive-soft)}
.weather-card{background:var(--paper-soft);border:1px solid var(--hairline);border-radius:2px;padding:14px 16px}
.weather-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.weather-temp{font-family:var(--fd);font-size:26px;font-weight:300;color:var(--ink)}
.weather-cond{font-family:var(--fui);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}
.weather-note{font-family:var(--fb);font-size:13px;color:var(--ink-soft);line-height:1.55;margin-top:6px;font-weight:300}
.weather-btn{margin-top:10px;font-family:var(--fui);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--hairline);padding-bottom:1px}
.weather-btn:hover{color:var(--ink)}

.week-grid{max-width:980px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.week-cell{background:var(--paper);border-radius:2px;min-height:200px;padding:18px 22px 20px;box-shadow:var(--shadow-soft);position:relative;display:flex;flex-direction:column;text-align:left}
.week-cell::before{content:"";position:absolute;top:0;left:0;width:60px;height:18px;background:var(--tan-soft)}
.week-cell.today::before{background:var(--ink)}
.week-cell .lbl{font-family:var(--fui);font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink);margin-top:6px;margin-bottom:4px;font-weight:500}
.week-cell .dt{font-family:var(--fd);font-size:14px;color:var(--ink-muted);letter-spacing:.06em;margin-bottom:14px}
.week-cell .wmarks{display:flex;flex-direction:column;gap:7px;font-family:var(--fb);font-weight:300;font-size:14px;color:var(--ink-soft);line-height:1.5;flex:1}
.week-cell .wmarks .wmk{display:flex;align-items:flex-start;gap:9px}
.week-cell .wmarks .wmk .dot{width:6px;height:6px;border-radius:50%;background:var(--tan-deep);margin-top:7px;flex-shrink:0}
.week-cell .wmarks .wmk.done .dot{background:var(--olive)}
.week-cell .wmarks .wmk.done{text-decoration:line-through;text-decoration-thickness:.5px;color:var(--ink-muted)}
.week-cell .wmarks .wmk.hot .dot{background:var(--rose)}
.week-cell .wempty{color:var(--ink-muted);font-style:italic;font-size:13.5px}
.week-cell.notes::before{background:var(--rose-soft)}
.week-cell.notes .lbl-script{font-family:var(--fs);font-size:34px;color:var(--ink);line-height:1;margin-top:8px}

.section-wrap{max-width:840px;margin:0 auto}
.paper{background:var(--paper);border-radius:2px;padding:32px 36px;box-shadow:var(--shadow-page);position:relative}
.paper::before{content:"";position:absolute;top:0;left:36px;width:60px;height:14px;background:var(--tan-soft)}
.paper-soft{background:var(--paper-soft);border:1px solid var(--hairline);border-radius:2px;padding:24px 28px}

.label-eyebrow{font-family:var(--fui);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 14px;font-weight:500;display:flex;align-items:center;gap:12px}
.label-eyebrow::after{content:"";flex:1;height:1px;background:var(--hairline)}
.label-eyebrow .right{flex:initial;font-family:var(--fui);font-size:10px;letter-spacing:.16em;color:var(--ink-muted);font-weight:400}

.field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.field label{font-family:var(--fui);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);font-weight:500}
.input,.textarea,.select{font-family:var(--fb);font-weight:300;font-size:14.5px;color:var(--ink);background:var(--paper-soft);border:1px solid var(--hairline);border-radius:2px;padding:11px 14px;letter-spacing:.005em;transition:border-color .15s;width:100%}
.input:focus,.textarea:focus,.select:focus{border-color:var(--ink-soft)}
.textarea{min-height:120px;resize:vertical;line-height:1.7}
.input::placeholder,.textarea::placeholder{color:var(--ink-muted);font-style:italic}
.select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path fill='%236E6452' d='M5 7L1 3h8z'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:34px}
body.dark .select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path fill='%23B5A88E' d='M5 7L1 3h8z'/></svg>")}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--fui);font-size:11.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;padding:11px 22px;border-radius:2px;transition:background .15s, color .15s, transform .12s, filter .15s}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-primary:hover{transform:translateY(-1px);filter:brightness(.92)}
.btn-ghost{border:1px solid var(--ink);color:var(--ink);background:transparent}
.btn-ghost:hover{background:var(--ink);color:var(--paper)}

.list{display:flex;flex-direction:column;gap:0}
.row{display:grid;grid-template-columns:24px 1fr auto;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--hairline-soft)}
.row:last-child{border-bottom:0}
.row .ic{font-size:16px;line-height:1;text-align:center;margin-top:2px;color:var(--ink-soft);width:24px;height:24px;display:grid;place-items:center}
.row .body{min-width:0}
.row .body .ttl{font-family:var(--fb);font-weight:400;font-size:14.5px;color:var(--ink);margin:0;line-height:1.4;letter-spacing:.005em}
.row .body .ttl .tm{font-family:var(--fd);font-size:13px;color:var(--rose);margin-right:8px;letter-spacing:.04em}
.row .body .why{font-family:var(--fb);font-weight:300;font-size:12.5px;color:var(--ink-muted);margin:3px 0 0;line-height:1.5;font-style:italic}
.row .body .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.row .body .meta .tag{font-family:var(--fui);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);padding:2px 8px;border:1px solid var(--hairline);border-radius:999px}
.row .body .meta .tag.hot{color:var(--rose);border-color:var(--rose-soft)}
.row .body .meta .tag.mid{color:var(--olive);border-color:var(--olive-soft)}
.row .body .meta .tag.lo{color:var(--indigo);border-color:var(--hairline)}
.row .body .meta .tag.rec{background:var(--paper-soft)}
.row.done .body .ttl{text-decoration:line-through;text-decoration-thickness:.5px;color:var(--ink-muted)}
.row .check{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1px solid var(--ink-muted);border-radius:1px;background:transparent;margin-top:4px;cursor:pointer;position:relative;transition:background .15s, border-color .15s}
.row .check:checked{background:var(--ink);border-color:var(--ink)}
.row .check:checked::after{content:"";position:absolute;left:3px;top:0;width:7px;height:10px;border-right:1.4px solid var(--paper);border-bottom:1.4px solid var(--paper);transform:rotate(40deg)}
.row .del{font-family:var(--fui);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted);align-self:center;opacity:0;transition:opacity .15s, color .15s}
.row:hover .del{opacity:1}
.row .del:hover{color:var(--rose)}

.empty{font-family:var(--fb);font-style:italic;font-weight:300;font-size:13.5px;color:var(--ink-muted);padding:18px 16px;background:var(--paper-soft);border-left:2px solid var(--tan);margin:8px 0 16px}
.divider{height:1px;background:var(--hairline);margin:28px 0}

/* MEMO cards */
.memo-list{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.memo-card{
  background:var(--paper);border-radius:2px;padding:20px 24px 18px;
  box-shadow:var(--shadow-soft);position:relative;
  border-left:2px solid var(--tan);
}
.memo-meta{
  font-family:var(--fui);font-size:10.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-muted);margin-bottom:10px;
}
.memo-body{
  font-family:var(--fb);font-weight:300;font-size:14.5px;line-height:1.75;
  color:var(--ink);letter-spacing:.005em;white-space:pre-wrap;word-break:keep-all;
}
.memo-ai{
  margin-top:16px;padding:14px 16px;
  background:var(--paper-soft);border-left:2px solid var(--rose-soft);
  border-radius:0 2px 2px 0;
}
.memo-ai-label{
  font-family:var(--fui);font-size:9.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--rose);font-weight:500;margin-bottom:6px;
}
.memo-ai-text{
  font-family:var(--fb);font-weight:300;font-size:13.5px;line-height:1.7;
  color:var(--ink);font-style:italic;letter-spacing:.005em;
}
.memo-ai-btn{
  margin-top:14px;font-family:var(--fui);font-size:10.5px;font-weight:500;
  letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);
  border-bottom:1px solid var(--hairline);padding:6px 4px;
  transition:color .15s, border-color .15s;
}
.memo-ai-btn:hover{color:var(--rose);border-color:var(--rose-soft)}

/* WORK BOARD cards */
.work-list{display:flex;flex-direction:column;gap:12px}
.work-card{
  background:var(--paper);border-radius:2px;
  padding:16px 20px 14px;
  box-shadow:var(--shadow-soft);
  border-left:2px solid var(--ink-soft);
  position:relative;
}
.work-card.late{border-left-color:var(--rose)}
.done-list .work-card{opacity:.55;border-left-color:var(--olive)}
.done-list .work-card .work-title{text-decoration:line-through;text-decoration-thickness:.5px;color:var(--ink-muted)}
.work-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.work-title{
  font-family:var(--fb);font-weight:500;font-size:14.5px;
  color:var(--ink);line-height:1.4;letter-spacing:.005em;flex:1;
}
.work-del{
  font-family:var(--fui);font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-muted);
  opacity:0;transition:opacity .15s, color .15s;
  flex-shrink:0;padding:2px 4px;
}
.work-card:hover .work-del{opacity:1}
.work-del:hover{color:var(--rose)}
.work-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.work-meta .tag{
  font-family:var(--fui);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-soft);
  padding:2px 8px;border:1px solid var(--hairline);border-radius:999px;
}
.work-meta .tag.hot{color:var(--rose);border-color:var(--rose-soft)}
.work-memo{
  font-family:var(--fb);font-weight:300;font-size:13px;line-height:1.6;
  color:var(--ink-soft);margin:0 0 10px;letter-spacing:.005em;white-space:pre-wrap;
}
.work-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.work-action{
  font-family:var(--fui);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-muted);
  border:1px solid var(--hairline);padding:5px 11px;border-radius:999px;
  background:var(--paper-soft);transition:all .15s;
}
.work-action:hover{color:var(--ink);border-color:var(--ink-muted);background:var(--paper)}

.timer-box{background:var(--paper);border-radius:2px;padding:48px 32px;text-align:center;box-shadow:var(--shadow-page);position:relative}
.timer-box::before{content:"";position:absolute;top:0;left:32px;width:60px;height:14px;background:var(--tan-soft)}
.timer-num{font-family:var(--fd);font-weight:300;font-size:120px;line-height:1.1;letter-spacing:.08em;color:var(--ink);margin:8px 0 6px;font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1, "lnum" 1;display:inline-block;padding:0 .04em}
.timer-sub{font-family:var(--fb);font-weight:300;font-size:14px;color:var(--ink-soft);margin:0 0 24px}
.timer-buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* Pomodoro */
.timer-box.break{
  background:var(--paper-soft);
  border-left:3px solid var(--olive);
}
.timer-box.break .timer-num{color:var(--olive)}
.duration-btn{
  padding:9px 16px;font-size:11px;
  border-color:var(--hairline);color:var(--ink-soft);
}
.duration-btn:hover{
  background:var(--paper-soft);color:var(--ink);
}
.duration-btn.active{
  background:var(--ink);color:var(--paper);border-color:var(--ink);
}
body.dark .duration-btn.active{background:var(--ink);color:var(--bg)}

.sticker-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));gap:14px;margin-top:8px}
.sticker-card{background:var(--paper);border:1px solid var(--hairline);border-radius:2px;padding:18px 16px;text-align:left;transition:border-color .15s, transform .15s;display:flex;align-items:center;gap:14px}
.sticker-card:hover{border-color:var(--ink-muted);transform:translateY(-2px)}
.sticker-card .em{font-size:24px;line-height:1;width:36px;height:36px;display:grid;place-items:center;background:var(--paper-soft);border-radius:2px;flex-shrink:0}
.sticker-card .info strong{display:block;font-family:var(--fb);font-weight:500;font-size:13.5px;color:var(--ink);letter-spacing:.005em}
.sticker-card .info span{display:block;font-family:var(--fui);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted);margin-top:2px}

.mood-row{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
.mood-row button{font-family:var(--fb);font-weight:400;font-size:12.5px;padding:7px 14px;border:1px solid var(--hairline);border-radius:999px;background:var(--paper);color:var(--ink-soft);transition:all .15s;letter-spacing:.005em}
.mood-row button:hover{border-color:var(--ink-muted);color:var(--ink)}
.mood-row button.on{background:var(--tan-soft);border-color:var(--tan-deep);color:var(--ink);font-weight:500}

.big-num{font-family:var(--fd);font-weight:300;font-size:64px;line-height:.9;color:var(--ink);letter-spacing:.02em;margin:8px 0 4px}
.big-num.neg{color:var(--rose)}
.big-num.pos{color:var(--olive)}
.big-cap{font-family:var(--fui);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-muted)}

.drawer{position:fixed;top:0;right:0;height:100vh;width:min(440px, 100%);background:var(--paper);box-shadow:-30px 0 60px -30px rgba(80,55,25,.3);transform:translateX(100%);transition:transform .35s cubic-bezier(.4,.0,.2,1);z-index:30;display:flex;flex-direction:column;border-left:1px solid var(--hairline)}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:28px 32px 18px;border-bottom:1px solid var(--hairline);position:relative}
.drawer-close{position:absolute;top:24px;right:24px;width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--hairline);border-radius:50%;transition:background .15s}
.drawer-close:hover{background:var(--tan-soft)}
.drawer-close svg{width:11px;height:11px;color:var(--ink-soft)}
.drawer-eyebrow{font-family:var(--fui);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:6px}
.drawer-date{font-family:var(--fd);font-weight:300;font-size:42px;line-height:1;letter-spacing:.06em;color:var(--ink);margin:0}
.drawer-date .day-name{font-family:var(--fs);font-size:28px;color:var(--ink-soft);margin-left:10px;letter-spacing:0}
.drawer-body{flex:1;overflow-y:auto;padding:24px 32px 32px}
.drawer-body::-webkit-scrollbar{width:4px}
.drawer-body::-webkit-scrollbar-thumb{background:var(--tan-soft)}

.add-inline{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--ink);padding:8px 4px;margin:0 0 24px}
.add-inline input{flex:1;font-family:var(--fb);font-weight:300;font-size:14.5px;color:var(--ink)}
.add-inline input::placeholder{color:var(--ink-muted);font-style:italic}
.add-inline button{font-family:var(--fui);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);padding:4px 8px}
.add-inline button:hover{color:var(--ink)}

.backdrop{position:fixed;inset:0;background:rgba(45,38,32,.18);opacity:0;visibility:hidden;transition:opacity .35s, visibility .35s;z-index:29}
body.dark .backdrop{background:rgba(0,0,0,.5)}
.backdrop.show{opacity:1;visibility:visible}

.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:2px;font-family:var(--fui);font-size:12px;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 8px 24px -10px rgba(0,0,0,.3);opacity:0;visibility:hidden;transition:all .3s;z-index:40}
body.dark .toast{background:var(--ink);color:var(--bg)}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}

.mobile-bar{display:none;position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--hairline);padding:10px 16px;align-items:center;justify-content:space-between;gap:12px}
.mobile-bar .ham{font-family:var(--fui);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);border:1px solid var(--hairline);padding:6px 12px}
.mobile-bar .mb-mark{font-family:var(--fg);font-weight:700;font-size:16px;color:var(--ink);letter-spacing:-.02em}

@media (max-width: 900px){
  .app{grid-template-columns:1fr;padding:0 0 60px;gap:0}
  .rail{position:fixed;top:0;left:0;height:100vh;width:260px;z-index:35;background:var(--paper);padding:24px 22px;border-right:1px solid var(--hairline);transform:translateX(-100%);transition:transform .3s;max-height:100vh}
  .rail.show{transform:translateX(0)}
  .mobile-bar{display:flex}
  .main{padding:16px 16px 0}
  .hero-title{font-size:60px;letter-spacing:.1em}
  .hero-script{font-size:38px;transform:translateX(0)}
  .sub-row{flex-direction:column;align-items:stretch;gap:14px}
  .sub-value{min-width:0}
  .cal-grid{grid-auto-rows:minmax(80px, auto)}
  .day{min-height:80px;padding:6px 6px 8px}
  .day .num{font-size:13px;margin-left:22px;margin-top:2px}
  .day .tab{width:28px;height:10px}
  .day .marks{font-size:9.5px}
  .week-grid{grid-template-columns:1fr}
  .cal-head div{font-size:9px;letter-spacing:.14em;padding:10px 2px}
  .gate-card{padding:48px 28px 36px}
  .gate-title{font-size:54px}
  .gate-subtitle{font-size:14px}
  .drawer{width:100%}
  .paper{padding:24px 20px}
  .brief-grid{grid-template-columns:1fr;gap:20px}
  .row2{grid-template-columns:1fr}
  .timer-num{font-size:80px}
}
</style>
</head>
<body>

<!-- WELCOME SPLASH -->
<div class="gate" id="gate">
  <button class="gate-theme" id="gateTheme" aria-label="theme">
    <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M8 2v1.5M8 12.5V14M14 8h-1.5M3.5 8H2M12.243 3.757l-1.06 1.06M4.818 11.182l-1.06 1.06M12.243 12.243l-1.06-1.06M4.818 4.818l-1.06-1.06" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
    <span id="gateThemeLabel">Light</span>
  </button>

  <div class="gate-card">
    <div class="gate-mark">TODOADHD</div>
    <h1 class="gate-title">정신차려</h1>
    <p class="gate-subtitle"><b>이 각박한 세상에서,</b> 그렇게 안 살기 프로젝트</p>
    <p class="gate-lede">
      까먹지 않게, 너무 몰아붙이지 않게.<br>
      오늘의 흐름을 계속 살려두는 작은 다이어리.
    </p>

    <div class="gate-divider"></div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-mode="login">로그인</button>
      <button class="auth-tab" data-mode="signup">회원가입</button>
    </div>

    <div class="auth-form">
      <div class="field">
        <label>아이디</label>
        <input class="input" type="text" id="authId" placeholder="예: mydiary, sunny, 2026" autocomplete="username" autocapitalize="none"/>
      </div>
      <div class="field">
        <label>비밀번호 <span class="hint" id="pwHint">(4자 이상)</span></label>
        <input class="input" type="password" id="authPw" placeholder="••••••" autocomplete="current-password"/>
      </div>
      <div class="field" id="pwConfirmField" hidden>
        <label>비밀번호 확인</label>
        <input class="input" type="password" id="authPw2" placeholder="••••••" autocomplete="new-password"/>
      </div>

      <p class="auth-error" id="authError" hidden></p>

      <button class="btn btn-primary auth-submit" id="authSubmit">로그인하기</button>

      <p class="auth-foot" id="authFootLogin">
        처음이신가요? <a href="#" class="auth-swap" data-mode="signup">회원가입하기</a>
      </p>
      <p class="auth-foot" id="authFootSignup" hidden>
        이미 계정이 있다면? <a href="#" class="auth-swap" data-mode="login">로그인하기</a>
      </p>
    </div>

<script>
/* =================================================================
   정신차려 · TODOADHD — Claude artifact (자체 회원가입/로그인)
   - 아이디 + 비밀번호로 회원가입, 로그인 가능
   - 사용자별 다이어리 데이터 분리 저장 (window.storage)
   ================================================================= */

/* ============ DOM helpers ============ */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

/* ============ Date/string helpers — Seoul time (KST) ============ */
const pad = n => String(n).padStart(2,'0');
// Return a Date object whose Y/M/D/H/M reflects current Seoul wall-clock time.
function nowKST(){
  // Build a new Date from Asia/Seoul wall-clock parts of current instant.
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Seoul',
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
  }).formatToParts(new Date()).reduce((o,p)=>{o[p.type]=p.value;return o},{});
  return new Date(+parts.year, +parts.month-1, +parts.day,
                  +parts.hour, +parts.minute, +parts.second);
}
// Convert any Date to Seoul wall-clock Y/M/D
function toKSTDate(d){
  if(!(d instanceof Date)) d = new Date(d);
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Seoul',
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
  }).formatToParts(d).reduce((o,p)=>{o[p.type]=p.value;return o},{});
  return new Date(+parts.year, +parts.month-1, +parts.day,
                  +parts.hour, +parts.minute, +parts.second);
}
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey = () => dkey(nowKST());
const safe = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

const monthNamesEN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const dayNamesKR = ['일','월','화','수','목','금','토'];
const weekdaysKR = ['SUN','MON','TUE','WED','THU','FRI','SAT'];

/* ============ Theme (must come early) ============ */
function getInitialTheme(){
  try{
    const saved = localStorage.getItem('todoadhd_theme');
    if(saved) return saved;
  }catch(e){}
  if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
  return 'light';
}
function applyTheme(t){
  document.body.classList.toggle('dark', t === 'dark');
  const lbl = $('#themeLabel'); if(lbl) lbl.textContent = t === 'dark' ? 'Dark mode' : 'Light mode';
  const glbl = $('#gateThemeLabel'); if(glbl) glbl.textContent = t === 'dark' ? 'Dark' : 'Light';
  try{ localStorage.setItem('todoadhd_theme', t); }catch(e){}
}
function toggleTheme(){
  applyTheme(document.body.classList.contains('dark') ? 'light' : 'dark');
}
applyTheme(getInitialTheme());
// Theme buttons (gate + sidebar)
const _gateTheme = $('#gateTheme'); if(_gateTheme) _gateTheme.addEventListener('click', toggleTheme);

/* ============ Toast (must be early - called from many places) ============ */
let toastT = null;
function toast(msg){
  clearTimeout(toastT);
  const el = $('#toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  toastT = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ============ Storage keys ============ */
const USERS_KEY = 'todoadhd_users';
const SESSION_KEY = 'todoadhd_session';
const userDataKey = (username) => `todoadhd_data_${username}`;

/* ============ Storage wrapper (window.storage + localStorage fallback) ============ */
async function sGet(key){
  if(typeof window.storage !== 'undefined'){
    try{ const r = await window.storage.get(key); return r ? r.value : null; }
    catch(e){ return null; }
  }
  return localStorage.getItem(key);
}
async function sSet(key, value){
  if(typeof window.storage !== 'undefined'){
    try{ await window.storage.set(key, value); return true; }
    catch(e){ console.warn('storage.set failed', e); return false; }
  }
  try{ localStorage.setItem(key, value); return true; }catch(e){ return false; }
}
async function sDel(key){
  if(typeof window.storage !== 'undefined'){
    try{ await window.storage.delete(key); }catch(e){}
  } else { try{ localStorage.removeItem(key); }catch(e){} }
}

/* ============ Password hashing (SHA-256 with salt) ============ */
async function hashPw(pw){
  const buf = new TextEncoder().encode(pw + '::todoadhd_salt_2026');
  const h = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,'0')).join('');
}

/* ============ Auth (signup / login / logout) ============ */
async function getUsers(){
  const raw = await sGet(USERS_KEY);
  try{ return raw ? JSON.parse(raw) : {}; }catch(e){ return {}; }
}
async function signup(username, pw){
  username = (username||'').trim().toLowerCase();
  if(username.length < 2) throw new Error('아이디는 2자 이상이어야 해.');
  if(!/^[a-z0-9_가-힣]+$/i.test(username)) throw new Error('아이디는 영문/숫자/한글만 가능해.');
  if((pw||'').length < 4) throw new Error('비밀번호는 4자 이상이어야 해.');
  const users = await getUsers();
  if(users[username]) throw new Error('이미 사용 중인 아이디야. 로그인으로 들어와줘.');
  users[username] = await hashPw(pw);
  await sSet(USERS_KEY, JSON.stringify(users));
  await sSet(SESSION_KEY, username);
  return username;
}
async function login(username, pw){
  username = (username||'').trim().toLowerCase();
  const users = await getUsers();
  if(!users[username]) throw new Error('가입되지 않은 아이디야. 회원가입부터 해줘.');
  const hash = await hashPw(pw||'');
  if(users[username] !== hash) throw new Error('비밀번호가 일치하지 않아.');
  await sSet(SESSION_KEY, username);
  return username;
}
async function logout(){
  await sDel(SESSION_KEY);
}
async function getSession(){
  return await sGet(SESSION_KEY);
}

  };
}

async function loadStore(){
  if(!currentUser){ store = defaultStore(); return; }
  setSyncState('syncing');
  try{
    const raw = await sGet(userDataKey(currentUser));
    if(raw){ store = {...defaultStore(), ...JSON.parse(raw)}; }
    else { store = defaultStore(); }
    setSyncState('synced');
  }catch(e){
    console.warn('load error', e);
    store = defaultStore();
    setSyncState('error');
  }
}

let saveTimer = null;
function saveStore(){
  if(!currentUser) return;
  store.updatedAt = Date.now();
  clearTimeout(saveTimer);
  setSyncState('syncing');
  saveTimer = setTimeout(async ()=>{
    const ok = await sSet(userDataKey(currentUser), JSON.stringify(store));
    setSyncState(ok ? 'synced' : 'error');
  }, 600);
}

let authMode = 'login';
function setAuthMode(m){
  authMode = m;

async function handleAuthSubmit(){
  hideAuthError();
  const id = $('#authId').value;
  const pw = $('#authPw').value;
  const pw2 = $('#authPw2').value;
  if(!id || !pw){ showAuthError('아이디와 비밀번호를 입력해줘.'); return; }
  if(authMode === 'signup' && pw !== pw2){
    showAuthError('비밀번호 확인이 일치하지 않아.');
    return;
  }
  const btn = $('#authSubmit');
  btn.classList.add('loading');
  btn.disabled = true;
  try{
    currentUser = authMode === 'signup' ? await signup(id, pw) : await login(id, pw);
    await loadStore();
    closeGate();
    render();
    toast(authMode === 'signup' ? '환영해 ♡ 가입 완료' : '환영해 ♡');
  }catch(err){
    showAuthError(err.message || '오류가 발생했어.');
  }finally{
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}

// Auth event wiring (DOM exists since script is at end of body)
$$('.auth-tab').forEach(t => t.addEventListener('click', () => setAuthMode(t.dataset.mode)));
$$('.auth-swap').forEach(a => a.addEventListener('click', e => { e.preventDefault(); setAuthMode(a.dataset.mode); }));
$('#authSubmit').addEventListener('click', handleAuthSubmit);
['authId','authPw','authPw2'].forEach(id => {
  const el = $('#' + id);
  if(el) el.addEventListener('keydown', e => { if(e.key === 'Enter') handleAuthSubmit(); });
});

/* ============ Auto-resume (stay logged in) ============ */
async function tryResume(){
  const sess = await getSession();
  if(sess){
    const users = await getUsers();
    if(users[sess]){
      currentUser = sess;
      await loadStore();
      closeGate();
      render();
      return true;
    }
  }
  return false;
}

/* ============ NL parsing ============ */
function dateAdd(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function nextDow(dow,base=nowKST()){let diff=(dow-base.getDay()+7)%7;if(diff===0)diff=7;return dateAdd(base,diff)}
function thisDow(dow,base=nowKST()){return dateAdd(base,(dow-base.getDay()+7)%7)}
function resolveDates(text){
  const t=text,dayMap={일:0,월:1,화:2,수:3,목:4,금:5,토:6};
  let recurrence=null,dates=[],m;
  m=t.match(/매주\s*([월화수목금토일])요일|([월화수목금토일])요일마다|주마다\s*([월화수목금토일])?/);
  if(/매일|맨날/.test(t))recurrence={type:'daily',label:'매일'};
  if(/평일마다/.test(t))recurrence={type:'weekday',label:'평일마다'};
  if(m){const ch=m[1]||m[2]||m[3]||'토';recurrence={type:'weekly',day:dayMap[ch],label:'매주 '+ch+'요일'}}
  if(/오늘/.test(t))dates.push(nowKST());
  if(/내일/.test(t))dates.push(dateAdd(nowKST(),1));
  if(/모레/.test(t))dates.push(dateAdd(nowKST(),2));
  m=t.match(/다음주\s*([월화수목금토일])요일?/);if(m)dates.push(dateAdd(thisDow(dayMap[m[1]]),7));
  m=t.match(/이번주\s*([월화수목금토일])요일?/);if(m)dates.push(thisDow(dayMap[m[1]]));
  m=t.match(/(\d{1,2})월\s*(\d{1,2})일/);if(m)dates.push(new Date(nowKST().getFullYear(),+m[1]-1,+m[2]));
  if(/이번주까지|이번 주까지/.test(t)&&!dates.length)dates.push(thisDow(5));
  if(recurrence&&!dates.length)dates.push(recurrence.type==='weekly'?nextDow(recurrence.day):nowKST());
  if(!dates.length)dates.push(new Date(selectedDate));
  return {dates,recurrence};
}
function splitIntents(raw){return raw.replace(/\n+/g,' 그리고 ').split(/(?:,|;|그리고|또|있고|있으며|해야 하고|해야돼|해야 해|하면 되고)/).map(s=>s.trim()).filter(Boolean)}
function titleFrom(text){
  let t=text.replace(/다음주|이번주|오늘|내일|모레|매주|매일|맨날|평일마다|주마다|[월화수목금토일]요일마다?|이번주까지|이번 주까지|\d{1,2}월\s*\d{1,2}일/g,' ')
            .replace(/있고|있어|있다|해야돼|해야 해|해야함|해야|까지|마다|좀|그리고/g,' ').replace(/\s+/g,' ').trim();
  if(/기획서|보고서/.test(text)&&/내|제출/.test(text))t=t.replace(/내.*/,'').trim()+' 제출';
  if(!t)t='할 일';
  return t.slice(0,30);
}
function priorityOf(text,date){
  const d=Math.ceil((new Date(date)-new Date(nowKST().toDateString()))/86400000);
  if(d<=1||/마감|제출|보고서|기획서|병원|미팅|회의|상환|결제|예약/.test(text))return {level:1,label:'🔥 지금 꼭 해야 함',why:'마감이나 약속성이 있어서 먼저 잡아둘게.'};
  if(/5분|짧|전화|연락|확인|정리/.test(text))return {level:2,label:'⚡ 15분만 하면 끝남',why:'짧게 끝낼 수 있는 행동이야.'};
  return {level:3,label:'🌱 가볍게 시작 가능',why:'부담 낮게 시작하면 흐름이 살아나.'};
}
function timeFor(i,p){
  if(p.level===1)return ['09:30','13:00','16:30','19:30'][i%4];
  if(p.level===2)return ['11:00','15:30','20:30'][i%3];
  return ['14:00','18:00','21:30'][i%3];
}
function tasksOn(k){return store.tasks.filter(t=>t.date===k).sort((a,b)=>(a.done-b.done)||(a.priority-b.priority)||(a.time||'').localeCompare(b.time||''))}

function renderWeek(root){

      <div class="dt">${d.getMonth()+1}월 ${d.getDate()}일</div>
      <div class="wmarks">${marks}</div>
    </button>`;
  }
  const notesK=`week-${monday.getFullYear()}-W${getWeekNum(monday)}`;
  cells+=`<div class="week-cell notes">
    <span class="lbl-script">Notes</span>
    <textarea class="textarea" id="weekNotes" style="background:transparent;border:0;padding:0;min-height:120px" placeholder="이번 주, 흘려보내지 않을 메모…">${safe(store.monthNotes[notesK]||'')}</textarea>

function getWeekNum(d){
  const t=new Date(d.valueOf());
  const dn=(d.getDay()+6)%7;
  t.setDate(t.getDate()-dn+3);
  const j4=new Date(t.getFullYear(),0,4);
  return 1+Math.ceil((t-j4)/86400000/7);
}

function parseSchedule(){
  const raw=$('#bulkInput').value.trim();if(!raw)return;
  const chunks=splitIntents(raw);let made=[];
  chunks.forEach((piece,idx)=>{
    const r=resolveDates(piece),title=titleFrom(piece),type=stickerType(piece+' '+title);
    let dates=r.dates;
    if(r.recurrence){
      dates=[];const start=r.dates[0];
      for(let i=0;i<4;i++)dates.push(r.recurrence.type==='daily'?dateAdd(start,i):r.recurrence.type==='weekday'?dateAdd(start,i):dateAdd(start,i*7));
    }
    dates.forEach((d,j)=>{
      const p=priorityOf(piece,dkey(d));
      made.push({id:Date.now()+Math.random(),date:dkey(d),time:timeFor(idx+j,p),text:title,type,done:false,priority:p.level,priorityLabel:p.label,reason:p.why,recurrence:r.recurrence,createdAt:Date.now()});
    });
  });
  store.tasks=[...store.tasks,...made];saveStore();
  if(made[0]){ selectedDate=new Date(made[0].date); cursor=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1); }
  view='calendar'; render();
  toast(`${chunks.length}개 → ${made.length}개 카드`);
}

function fmtLeft(ms){

function beep(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ctx = new AC();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine'; o.frequency.value = 660;
    g.gain.setValueAtTime(0, ctx.currentTime);
    g.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.02);
    g.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.6);
    o.start();
    o.stop(ctx.currentTime + 0.6);
    setTimeout(()=>{
      const o2 = ctx.createOscillator();
      const g2 = ctx.createGain();
      o2.connect(g2); g2.connect(ctx.destination);
      o2.type = 'sine'; o2.frequency.value = 880;
      g2.gain.setValueAtTime(0, ctx.currentTime);
      g2.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.02);
      g2.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.5);
      o2.start(); o2.stop(ctx.currentTime + 0.5);
    }, 350);
  }catch(e){}
}

        <p style="margin:0 0 8px;font-family:var(--fb);font-weight:300;font-size:13px;color:var(--ink-soft);line-height:1.65">·  쉬는 시간엔 폰 보지 말고 진짜로 일어나. 도파민 절약</p>
        <p style="margin:0;font-family:var(--fb);font-weight:300;font-size:13px;color:var(--ink-soft);line-height:1.65">·  몰입 잘되면 그냥 계속. 굳이 멈추지 마</p>
      </div>
    </div>
  `;

  if(!running){
    $$('.duration-btn').forEach(b => b.onclick = () => {
      focusDuration = +b.dataset.dur;
      $$('.duration-btn').forEach(x => x.classList.toggle('active', +x.dataset.dur === focusDuration));
    });
    $('#fStart').onclick = () => {
      focusLabel = $('#focusLabel')?.value.trim() || '';
      startPomodoro(focusDuration);
    };
    const labelEl = $('#focusLabel');
    if(labelEl) labelEl.addEventListener('keydown', e => { if(e.key==='Enter') $('#fStart').click(); });
  } else {
    const skip = $('#fSkip');
    if(skip) skip.onclick = () => {
      if(phase === 'break'){ stopFocus(); }
      else { stopFocus(); toast('중단했어. 괜찮아'); }
    };
  }
}

function startPomodoro(min){
  stopFocus();
  focusPhase = 'work';
  focusDuration = min;
  focusEnd = Date.now() + min * 60000;
  focusTimer = setInterval(()=>{
    const left = Math.max(0, focusEnd - Date.now());
    const el = $('#timer'); if(el) el.textContent = fmtLeft(left);
    if(left <= 0){
      clearInterval(focusTimer); focusTimer = null;
      store.focusLog = store.focusLog || [];
      store.focusLog.push({date: todayKey(), min, kind:'work', label: focusLabel, at: Date.now()});
      saveStore();
      beep();
      toast(`${min}분 완료 ✦ 쉬자`);
      // Auto-start break: short break (5min) or long break (15min after 4 cycles)
      const todayCycles = store.focusLog.filter(f => f.date === todayKey() && f.kind !== 'break').length;
      const breakMin = todayCycles > 0 && todayCycles % 4 === 0 ? 15 : 5;
      startBreak(breakMin);
    }
  }, 500);
  if(view === 'focus') render();
}

function startBreak(min){
  focusPhase = 'break';
  focusEnd = Date.now() + min * 60000;
  focusTimer = setInterval(()=>{
    const left = Math.max(0, focusEnd - Date.now());
    const el = $('#timer'); if(el) el.textContent = fmtLeft(left);
    if(left <= 0){
      clearInterval(focusTimer); focusTimer = null;
      store.focusLog = store.focusLog || [];
      store.focusLog.push({date: todayKey(), min, kind:'break', at: Date.now()});
      saveStore();
      beep();
      toast('쉬는 시간 끝 ✦ 또 갈까');
      focusPhase = 'idle';
      focusEnd = 0;
      if(view === 'focus') render();
    }
  }, 500);
  if(view === 'focus') render();
}

function stopFocus(){
  if(focusTimer){ clearInterval(focusTimer); focusTimer = null; }
  focusEnd = 0;
  focusPhase = 'idle';
  if(view === 'focus') render();
}

function memoComment(text){
  if(!text) return '아직 비어있네. 뭐든 적어두면 나중에 너가 고마워할 거야';
  const r = (rx) => rx.test(text);
  if(r(/일정|업무|마감|프로젝트|보고서|작업|업로드|회의|미팅/i))
    return '이거 일정으로 옮겨두면 머릿속에서 비울 수 있어. 첫 단계만 캘린더에';
  if(r(/사람|친구|관계|남친|여친|썸|싸웠|연락|상처|배신|믿|의심|서운/i))
    return '나중에 다시 읽으면 다르게 보일 거야. 사실이랑 너의 해석은 분리해서 적어둬';
  if(r(/돈|투자|매매|손실|수익|코인|주식|살까|구매|쇼핑/i))
    return '24시간만 미뤄봐. 내일도 같은 마음이면 그땐 진짜';
  if(r(/우울|불안|힘들|지쳤|망했|무서|싫|짜증|화나|스트레스/i))
    return '이 감정도 정보야. 뭐가 트리거였는지만 적어두면 다음에 미리 알아챌 수 있어';
  if(r(/뿌듯|좋|행복|성공|해냈|기쁘|감사|만족/i))
    return '좋았던 거 조건들 적어둬. 시간 / 장소 / 누구랑 / 직전에 뭐 했는지';
  if(r(/아이디어|생각났|해보고 ?싶|만들고 ?싶|시도/i))
    return '5분짜리 첫 행동만 정해서 일정에 옮겨놔. 안 그러면 휘발돼';
  if(r(/후회|반성|실수|또|왜 ?그랬|할걸/i))
    return '평가는 그만. 다음엔 어떻게 다르게 할지 한 줄로';
  if(r(/계획|목표|시작|할거|해야지|할것/i))
    return '계획은 작을수록 살아남아. 24시간 안에 할 수 있는 거 하나만';
  return '글로 옮긴 순간 절반은 정리된 거야. 나중에 다시 읽으면 그때 너가 좀 더 나아가 있을 듯';
}

/* ============ Clothing / umbrella / temp gap helpers ============ */
function clothingFor(maxT){
  if(maxT >= 28) return '반팔 · 민소매 · 린넨';
  if(maxT >= 23) return '반팔 · 얇은 셔츠';
  if(maxT >= 20) return '얇은 가디건 · 긴팔';
  if(maxT >= 17) return '가디건 · 후드 · 청자켓';
  if(maxT >= 12) return '자켓 · 트렌치 · 야상';
  if(maxT >= 9)  return '코트 · 가죽자켓 · 두꺼운 니트';
  if(maxT >= 5)  return '두꺼운 코트 · 무스탕';
  if(maxT >= 0)  return '패딩 · 목도리 · 장갑';
  return '두꺼운 패딩 · 풀세트 무장';
}
function umbrellaFor(prob, mm){
  if(prob >= 80) return '우산 필수 · 큰 거로 챙겨';
  if(prob >= 60) return '우산 챙기는 게 안전해';
  if(prob >= 30) return '소나기 대비, 접이식이라도';
  if(mm > 0)     return '약하게 올 수 있어';
  return '우산 없어도 OK';
}
function gapAdvice(max, min){
  const gap = Math.abs(max - min);
  if(gap >= 12) return `일교차 ${Math.round(gap)}°C · 겉옷 꼭 챙겨`;
  if(gap >= 8)  return `일교차 ${Math.round(gap)}°C · 아침저녁 가디건 필요`;
  return `일교차 ${Math.round(gap)}°C · 안정적`;
}

/* ============ AI-like brief: analyzes accumulated patterns ============ */
function briefText(){
  const tk = todayKey();
  const tasks = store.tasks || [];
  const todayTasks = tasks.filter(t => t.date === tk);
  const todayHot = todayTasks.find(t => t.priority === 1 && !t.done);
  const late = tasks.filter(t => !t.done && t.date < tk).length;

  // Past 7 days completion rate
  const start7 = dateAdd(nowKST(), -6);
  const start7K = dkey(start7);
  const last7 = tasks.filter(t => t.date >= start7K && t.date <= tk);
  const last7Done = last7.filter(t => t.done).length;
  const rate7 = last7.length ? Math.round((last7Done / last7.length) * 100) : null;

  // Days since last mood / memo / invest entry
  const moods = (store.diaries || []).slice().sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const daysSinceMood = moods[0]?.date ? Math.floor((nowKST() - new Date(moods[0].date)) / 86400000) : null;

  const memos = (store.memos || []).slice().sort((a,b) => (b.savedAt||0) - (a.savedAt||0));
  const daysSinceMemo = memos[0] ? Math.floor((Date.now() - memos[0].savedAt) / 86400000) : null;

  const invests = (store.invests || []).slice().sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const daysSinceInvest = invests[0]?.date ? Math.floor((nowKST() - new Date(invests[0].date)) / 86400000) : null;

  // Focus minutes this week
  const weekStart = nowKST(); weekStart.setDate(weekStart.getDate() - weekStart.getDay());
  const wkStartK = dkey(weekStart);
  const focusMin = (store.focusLog || []).filter(f => f.date >= wkStartK).reduce((a,b) => a + (b.min||0), 0);

  // Build messages, priority order
  const arr = [];
  if(todayHot) arr.push(`${todayHot.text} 먼저 처리하면 좀 가벼워질 듯`);
  if(late >= 3) arr.push(`밀린 게 ${late}개. 한꺼번에 보지 말고 가벼운 거 하나만`);
  else if(late) arr.push(`밀린 ${late}개, 오늘 처리 가능한 만큼만`);

  if(daysSinceMood !== null && daysSinceMood >= 3)
    arr.push(`감정 일기 ${daysSinceMood}일째 비어있네. 한 줄이라도 좋아`);

  if(daysSinceMemo !== null && daysSinceMemo >= 5)
    arr.push(`메모 ${daysSinceMemo}일 동안 안 적었네`);

  if(daysSinceInvest !== null && daysSinceInvest >= 4 && (store.invests||[]).length)
    arr.push(`투자 복기 ${daysSinceInvest}일째. 수익보단 그때 마음이 어땠는지`);

  if(rate7 !== null && last7.length >= 5){
    if(rate7 >= 75) arr.push(`지난 일주일 완료율 ${rate7}%. 좋다, 무리하지만 마`);
    else if(rate7 <= 30) arr.push(`완료율 ${rate7}%. 계획 좀 더 잘게 잘라보는 것도`);
  }

  if(focusMin >= 90) arr.push(`이번 주 집중 ${focusMin}분, 꾸준하네`);

  if((store.streak?.count || 0) >= 5)
    arr.push(`${store.streak.count}일 연속이네, 좋다`);

  if(store.weather?.advice) arr.push(store.weather.advice);

  if(!arr.length) arr.push('오늘은 그냥 작은 거 하나만 해도 충분해');
  return arr.slice(0, 4).join(' ');
}

function briefPills(){
  const today = tasksOn(todayKey());
  const left = today.filter(t => !t.done).length;
  const done = today.filter(t => t.done).length;
  const hot = today.filter(t => t.priority === 1 && !t.done).length;
  const items = [
    {cls:'', txt:`남은 ${left}`},
    {cls:'done', txt:`완료 ${done}`},
    {cls:'hot', txt:`중요 ${hot}`},
    {cls:'', txt:`streak ${store.streak?.count || 0}d`}
  ];
  return items.map(p => `<span class="pill ${p.cls}">${p.txt}</span>`).join('');
}

function weatherHtml(){
  if(!store.weather){
    return `<div class="weather-card">
      <div class="weather-line"><span class="weather-temp">—</span><span class="weather-cond">no data</span></div>
      <p class="weather-note">위치를 허용하면 온도, 일교차, 옷차림, 우산 여부를 알려줄게.</p>
      <button class="weather-btn" id="weatherBtn">날씨 불러오기 ↺</button>
    </div>`;
  }
  const w = store.weather;
  const hasMinMax = w.tmin != null && w.tmax != null;
  return `<div class="weather-card">
    <div class="weather-line">
      <span class="weather-temp">${w.temp}°</span>
      <span class="weather-cond">${hasMinMax ? `${Math.round(w.tmin)}° / ${Math.round(w.tmax)}°` : (w.rain > 0 ? 'rain' : 'clear')} · 습 ${w.humidity}%</span>
    </div>
    ${hasMinMax ? `<p class="weather-note">${safe(gapAdvice(w.tmax, w.tmin))}</p>` : ''}
    <p class="weather-note">👕 ${safe(clothingFor(hasMinMax ? w.tmax : w.temp))}</p>
    <p class="weather-note">☂ ${safe(umbrellaFor(w.rainProb || 0, w.rain || 0))}</p>
    ${w.pm25 != null ? `<p class="weather-note">미세먼지 PM2.5 · ${w.pm25} ${w.pm25 < 16 ? '좋음' : w.pm25 < 36 ? '보통' : w.pm25 < 76 ? '나쁨' : '매우 나쁨'}</p>` : ''}
    ${w.advice ? `<p class="weather-note" style="font-style:italic;color:var(--ink)">${safe(w.advice)}</p>` : ''}
    <button class="weather-btn" id="weatherBtn">날씨 갱신 ↺</button>
  </div>`;
}

async function loadWeather(){
  if(!navigator.geolocation){ toast('위치 미지원'); return; }
  toast('위치 가져오는 중…');
  navigator.geolocation.getCurrentPosition(async p => {
    try{
      const lat = p.coords.latitude, lon = p.coords.longitude;
      const fUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
        + `&current=temperature_2m,relative_humidity_2m,rain,precipitation`
        + `&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum`
        + `&timezone=Asia%2FSeoul&forecast_days=1`;
      const aUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=pm2_5&timezone=Asia%2FSeoul`;
      const [fr, ar] = await Promise.all([fetch(fUrl), fetch(aUrl).catch(() => null)]);
      const fj = await fr.json();
      const aj = ar ? await ar.json() : null;
      const c = fj.current || {};
      const d = fj.daily || {};
      const aq = aj?.current || {};

      const tmax = d.temperature_2m_max?.[0];
      const tmin = d.temperature_2m_min?.[0];
      const rainProb = d.precipitation_probability_max?.[0] ?? 0;
      const rainMm = d.precipitation_sum?.[0] ?? c.rain ?? c.precipitation ?? 0;

      // Build a contextual one-liner advice
      let adv = '';
      if(rainProb >= 60 || rainMm > 2) adv = '비 와. 이동시간 +10분으로 잡아둬';
      else if(tmax >= 30) adv = '폭염이라 오후엔 집중 잘 안 될 수도. 중요한 건 오전에';
      else if(tmax >= 27) adv = '오후엔 좀 더울 듯. 중요한 거 오전에';
      else if(tmax < 5) adv = '추워. 외출 줄이고 실내 위주로';
      else if(Math.abs(tmax - tmin) >= 12) adv = '일교차 크네. 겉옷 챙겨';
      else adv = '날씨 무난해. 카페 작업도 좋겠다';

      store.weather = {
        temp: Math.round(c.temperature_2m),
        humidity: c.relative_humidity_2m,
        rain: rainMm,
        rainProb,
        tmin, tmax,
        pm25: aq.pm2_5 != null ? Math.round(aq.pm2_5) : null,
        advice: adv,
        at: Date.now()
      };
      saveStore();
      render();
      toast('날씨 갱신 ♡');
    }catch(e){
      console.warn('weather error', e);
      toast('날씨 못 불러왔어');
    }
  }, () => toast('위치 권한 필요'), { enableHighAccuracy:false, timeout:9000 });
}

/* DRAWER */
function openDrawer(){
  $('#drawer').classList.add('open');
  $('#backdrop').classList.add('show');
  $('#drawer').setAttribute('aria-hidden','false');
  renderDrawer();
}
function closeDrawer(){
  $('#drawer').classList.remove('open');
  $('#backdrop').classList.remove('show');
  $('#drawer').setAttribute('aria-hidden','true');
}
$('#drawerClose').addEventListener('click',closeDrawer);
$('#backdrop').addEventListener('click',closeDrawer);

function renderDrawer(){
  const k=dkey(selectedDate);
  const list=tasksOn(k),done=list.filter(t=>t.done).length,hot=list.find(t=>t.priority===1&&!t.done);
  const diary=store.diaries.find(d=>d.date===k)||{};
  $('#drawerEyebrow').textContent=k===todayKey()?'Today':'Selected';
  $('#drawerDate').innerHTML=`${selectedDate.getMonth()+1}월 ${selectedDate.getDate()}일 <span class="day-name">${dayNamesKR[selectedDate.getDay()]}</span>`;
  $('#drawerBody').innerHTML=`
    <p class="label-eyebrow">${k===todayKey()?'오늘 할 일':'그 날 할 일'} <span class="right">${done}/${list.length}</span></p>
    ${list.length?`<div class="list" id="taskList">${list.map(t=>`
      <div class="row ${t.done?'done':''}" data-tid="${t.id}">
        <div class="ic">${stickerEmoji(t.type||'fallback')}</div>
        <div class="body">
          <p class="ttl"><span class="tm">${safe(t.time||'')}</span>${safe(t.text)}</p>
          <div class="meta">
            <span class="tag ${t.priority===1?'hot':t.priority===2?'mid':'lo'}">${safe(t.priorityLabel||'')}</span>
            ${t.recurrence?`<span class="tag rec">${safe(t.recurrence.label)}</span>`:''}
          </div>
          ${t.reason?`<p class="why">${safe(t.reason)}</p>`:''}
        </div>
        <input type="checkbox" class="check" ${t.done?'checked':''} data-toggle="${t.id}"/>
      </div>`).join('')}</div>`:'<p class="empty">이 날은 비어있어. 일부러 비워둬도 괜찮아.</p>'}
    <div class="add-inline">
      <input id="qTask" placeholder="이 날짜에 빠르게 추가…"/>
      <button id="qAdd">Add</button>
    </div>
    <div class="divider"></div>
    <p class="label-eyebrow">AI 우선순위</p>
    <p style="margin:0 0 18px;font-family:var(--fb);font-weight:300;font-size:14px;color:var(--ink);font-style:italic;line-height:1.6">${hot?safe(hot.text)+' · '+safe(hot.priorityLabel):'급한 불은 없어. 가벼운 것부터 잡아도 돼.'}</p>
    <div class="divider"></div>
    <p class="label-eyebrow">감정 일기</p>
    ${diary.text?`<p style="margin:0 0 8px;font-family:var(--fb);font-weight:300;font-size:14px;color:var(--ink-soft);line-height:1.7">${safe(diary.text)}</p>${diary.mood?`<span class="tag" style="font-family:var(--fui);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);padding:2px 8px;border:1px solid var(--hairline);border-radius:999px">${safe(diary.mood)}</span>`:''}`:'<p class="empty" style="margin:0">아직 기록 없음</p>'}
  `;
  $$('#drawerBody [data-toggle]').forEach(b=>b.onchange=()=>toggleTask(b.dataset.toggle));
  $('#qAdd').onclick=quickAddDrawer;
  $('#qTask').addEventListener('keydown',e=>{if(e.key==='Enter')quickAddDrawer()});
}
function quickAddDrawer(){
  const text=$('#qTask').value.trim();if(!text)return;
  const k=dkey(selectedDate);
  const p=priorityOf(text,k);
  const type=stickerType(text);
  store.tasks.push({id:Date.now()+Math.random(),date:k,time:timeFor(0,p),text:text.slice(0,40),type,done:false,priority:p.level,priorityLabel:p.label,reason:p.why,createdAt:Date.now()});
  saveStore();
  $('#qTask').value='';
  renderDrawer(); render();
}
function toggleTask(id){
  const t=store.tasks.find(x=>String(x.id)===String(id));if(!t)return;
  t.done=!t.done;
  if(t.done){
    if(t.date===todayKey()&&store.streak.last!==todayKey()){
      store.streak.count=(store.streak.count||0)+1;
      store.streak.last=todayKey();
    }
    toast('완료 ✦');
  }
  saveStore();renderDrawer();render();
}

$('#themeBtn').addEventListener('click', toggleTheme);

$('#menuOpen').addEventListener('click',()=>$('#rail').classList.add('show'));
$('#todayMobile').addEventListener('click',()=>{
  selectedDate=nowKST();cursor=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);
  view='calendar';$('#rail').classList.remove('show');render();
});
document.addEventListener('click',e=>{
  if(window.innerWidth>900) return;
  if($('#rail').classList.contains('show')&&!$('#rail').contains(e.target)&&!$('#menuOpen').contains(e.target)){
    $('#rail').classList.remove('show');
  }
});

/* Sign out handler */
$('#signOut').addEventListener('click', async ()=>{
  await logout();
  currentUser = null;
  store = defaultStore();
  // Clear form
  $('#authId').value = '';
  $('#authPw').value = '';
  $('#authPw2').value = '';
  hideAuthError();
  setAuthMode('login');
  openGate();
  toast('로그아웃 완료');
});

/* INIT — auto-resume previous session if exists */
(async ()=>{
  setAuthMode('login');
  const resumed = await tryResume();
  if(!resumed){
    setSyncState('offline');
  }
})();
</script>
